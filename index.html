<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'">
<title>Whospair</title>
<style>
  :root { --bg:#0f1115; --ink:#e8e6e1; --soft:#9a9890; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f2ee; --ink:#1c1d20; --soft:#6a6862; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; }
  h1 { font-weight:600; margin:0 0 8px; }
  p { color:var(--soft); margin:0; max-width:420px; }
</style>
</head>
<body>
<main>
  <h1>Whospair</h1>
  <p>A messenger with no server and no phone number. Everything goes through Tor.</p>
</main>
</body>
</html>
